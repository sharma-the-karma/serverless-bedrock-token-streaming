AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Token Streaming with Amazon Bedrock ConverseStream,
  AWS Lambda Response Streaming, and CloudFront.

Parameters:
  CorsOrigin:
    Type: String
    Default: "https://yourdomain.com"
    Description: >
      Allowed CORS origin for the Function URL. Set to your specific frontend origin.
      Avoid wildcard '*' in production to protect against unauthorized cross-site requests.

  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: "ChangeMeInProductionSecretToken123!"
    Description: >
      Shared secret header passed by CloudFront (X-Origin-Verify) to prevent direct
      unauthorized calls to the Function URL.

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_OPTIONS: "--enable-source-maps"
        BEDROCK_MODEL_ID: "amazon.nova-pro-v1:0"
        ALLOWED_ORIGIN: !Ref CorsOrigin
        ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret

Resources:
  # Node.js Lambda Function with Native Response Streaming
  BedrockStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/
      Handler: index.handler
      Description: "Streams Amazon Bedrock tokens in real-time via Server-Sent Events (SSE)"
      Policies:
        - Statement:
            - Sid: BedrockPinnedModelInvokePolicy
              Effect: Allow
              Action:
                - bedrock:InvokeModelWithResponseStream
                - bedrock:ConverseStream
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-haiku-20241022-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-7-sonnet-20250219-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      FunctionUrlConfig:
        AuthType: NONE # Secured via CloudFront X-Origin-Verify shared secret header validation
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - !Ref CorsOrigin
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - Authorization
            - x-api-key
            - x-origin-verify
          MaxAge: 3600

  # Python Lambda Function with AWS Lambda Web Adapter (Alternative)
  BedrockPythonStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Description: "Python FastAPI Bedrock streamer using AWS Lambda Web Adapter"
      Policies:
        - Statement:
            - Sid: BedrockPinnedModelInvokePolicyPython
              Effect: Allow
              Action:
                - bedrock:InvokeModelWithResponseStream
                - bedrock:ConverseStream
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-haiku-20241022-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-7-sonnet-20250219-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - !Ref CorsOrigin
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - "*"
    Metadata:
      DockerTag: latest
      DockerContext: ../lambda/python_adapter
      Dockerfile: Dockerfile

  # CloudFront Distribution (Configured without edge response buffering)
  StreamingDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: "CloudFront CDN routing to Lambda Function URL without response buffering"
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: LambdaFunctionUrlOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt BedrockStreamingFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: "X-Origin-Verify"
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: LambdaFunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          # AWS Managed-CachingDisabled (ensures CloudFront does not buffer SSE chunks)
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-44ca84e08fad
          # AWS Managed-AllViewerExceptHostHeader (Verified AWS ID: b689b0a8-53d0-40ab-baf2-68738e2966ac)
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  NodeFunctionUrl:
    Description: "Direct Lambda Function URL (Node.js Streaming)"
    Value: !GetAtt BedrockStreamingFunctionUrl.FunctionUrl

  PythonFunctionUrl:
    Description: "Direct Lambda Function URL (Python FastAPI Web Adapter)"
    Value: !GetAtt BedrockPythonStreamingFunctionUrl.FunctionUrl

  CloudFrontDomain:
    Description: "CloudFront CDN Endpoint (Public Entrypoint)"
    Value: !Sub "https://${StreamingDistribution.DomainName}"
