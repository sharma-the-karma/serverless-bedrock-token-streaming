AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Token Streaming with Amazon Bedrock ConverseStream,
  AWS Lambda Response Streaming, and CloudFront.

Parameters:
  FunctionAuthType:
    Type: String
    Default: AWS_IAM
    AllowedValues:
      - AWS_IAM
      - NONE
    Description: >
      Authentication mode for the Function URL. Use AWS_IAM for production (SigV4 signing).
      Use NONE only for local sandbox testing behind an API key or WAF.

  CorsOrigin:
    Type: String
    Default: "https://yourdomain.com"
    Description: >
      Allowed CORS origin for the Function URL. Set to your specific frontend origin.
      Avoid wildcard '*' in production to protect against unauthorized cross-site requests.

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        NODE_OPTIONS: "--enable-source-maps"
        BEDROCK_MODEL_ID: "us.anthropic.claude-3-7-sonnet-20250219-v1:0"
        ALLOWED_ORIGIN: !Ref CorsOrigin

Resources:
  # Node.js Lambda Function with Native Response Streaming
  BedrockStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/
      Handler: index.handler
      Description: "Streams Amazon Bedrock tokens in real-time via Server-Sent Events (SSE)"
      Policies:
        - Statement:
            - Sid: BedrockScopedInvokePolicy
              Effect: Allow
              Action:
                - bedrock:InvokeModelWithResponseStream
                - bedrock:ConverseStream
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      FunctionUrlConfig:
        AuthType: !Ref FunctionAuthType
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - !Ref CorsOrigin
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - Authorization
            - x-api-key
          MaxAge: 3600

  # Python Lambda Function with AWS Lambda Web Adapter (Alternative)
  BedrockPythonStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Description: "Python FastAPI Bedrock streamer using AWS Lambda Web Adapter"
      Policies:
        - Statement:
            - Sid: BedrockScopedInvokePolicyPython
              Effect: Allow
              Action:
                - bedrock:InvokeModelWithResponseStream
                - bedrock:ConverseStream
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      FunctionUrlConfig:
        AuthType: !Ref FunctionAuthType
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - !Ref CorsOrigin
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - "*"
    Metadata:
      DockerTag: latest
      DockerContext: ../lambda/python_adapter
      Dockerfile: Dockerfile

  # CloudFront Distribution (Configured without edge response buffering)
  StreamingDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: "CloudFront CDN routing to Lambda Function URL without response buffering"
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: LambdaFunctionUrlOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt BedrockStreamingFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: LambdaFunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          # AWS Managed-CachingDisabled (ensures CloudFront does not buffer SSE chunks)
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-44ca84e08fad
          # AWS Managed-AllViewerExceptHostHeader (Verified AWS ID: b689b0a8-53d0-40ab-baf2-68738e2966ac)
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  NodeFunctionUrl:
    Description: "Direct Lambda Function URL (Node.js Streaming)"
    Value: !GetAtt BedrockStreamingFunctionUrl.FunctionUrl

  PythonFunctionUrl:
    Description: "Direct Lambda Function URL (Python FastAPI Web Adapter)"
    Value: !GetAtt BedrockPythonStreamingFunctionUrl.FunctionUrl

  CloudFrontDomain:
    Description: "CloudFront CDN Endpoint"
    Value: !Sub "https://${StreamingDistribution.DomainName}"
